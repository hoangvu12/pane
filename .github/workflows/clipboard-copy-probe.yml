name: macOS clipboard copy probe
on:
  push:
    branches: [fix/clipboard-file-smoke]
    paths-ignore:
      - crates/pane-core/tests/**
      - .github/workflows/clipboard-copy-probe.yml
      - .github/workflows/ci-fast.yml
      - .config/nextest.toml
permissions:
  contents: read
jobs:
  clipboard-phase:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        phase: [installer-clipboard, full]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Build the clipboard phase's application and artifact source
        run: |
          cargo build --locked -p pane
          cargo xtask guests
          cargo xtask package-macos --dev
      - name: Replay only the existing clipboard phase
        env:
          PANE_TEST_CLIPBOARD_TRACE: '1'
          PROBE_PHASE: ${{ matrix.phase }}
        run: |
          bash scripts/smoke-macos-default-startup.sh clipboard-probe/default-startup
          python3 - <<'PY'
          from pathlib import Path
          import os
          source = Path('scripts/smoke-macos.sh').read_text()
          prefix = source.split('# The Rust, JavaScript and TypeScript samples are no commands', 1)[0]
          marker = '# Installing Pane and acquiring its calculator'
          phase = marker + source.split(marker, 1)[1].split('# Installing a Pane application update', 1)[0]
          script = source if os.environ['PROBE_PHASE'] == 'full' else prefix + 'service_pid=\n' + phase
          Path('scripts/clipboard-probe.generated.sh').write_text(script)
          PY
          bash scripts/clipboard-probe.generated.sh clipboard-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipboard-phase-probe-${{ matrix.phase }}
          path: clipboard-probe
