[package]
name = "pane-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
unicode-normalization = "0.1"
wasmtime = { version = "=49.0.1", default-features = false, features = ["cache", "cranelift", "parallel-compilation", "runtime", "std", "async", "component-model", "component-model-async"] }
wasmtime-wasi = { version = "=49.0.1", default-features = false, features = ["p3"] }

# Opening a Start menu shortcut as Explorer does (already in the dependency
# tree through the GPUI and Wasmtime dependencies).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
tempfile = "3"
